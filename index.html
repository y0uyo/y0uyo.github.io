<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Archive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background-color: #f5f5f5; }
    header { padding: 1rem; background: #111; color: white; text-align: center; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }

    .banner {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      aspect-ratio: 16 / 9;
      transition: transform 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .banner:hover { transform: scale(1.03); }
    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .banner:hover::before { opacity: 1; }

    .banner-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1;
      padding: 0.5rem 1rem;
      width: 90%;
      line-height: 1.1;
      background: none;
    }
    .banner:hover .banner-title { opacity: 1; }

    .detail-view {
      display: none;
      flex-direction: column;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .back-btn {
      margin-bottom: 1rem;
      background: none;
      border: none;
      color: #111;
      cursor: pointer;
      font-size: 1rem;
      text-align: left;
      font-weight: 700;
    }

    .detail-header {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      align-items: start;
    }

    .detail-banner-wrap {
      width: 100%;
      max-width: 420px;
    }

    .detail-image {
      width: 100%;
      height: 240px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      background: #ddd;
    }

    .detail-content h2 { margin-bottom: 0.25rem; }
    .detail-year { opacity: 0.7; margin-bottom: 0.75rem; }

    .detail-desc {
      margin-top: 0.25rem;
      background: white;
      border-radius: 10px;
      padding: 0.75rem;
      line-height: 1.35;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      max-height: 240px;
      overflow: auto;
      white-space: pre-wrap;
    }

    #detail-links {
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    #detail-links a {
      text-decoration: none;
      color: #111;
      font-weight: 700;
      background: white;
      border-radius: 999px;
      padding: 0.5rem 0.75rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    #detail-links a:hover { transform: translateY(-1px); }

    /* MEDIA */
    :root {
      --media-row-height: 180px;
      --media-gap: 14px;
      --media-radius: 12px;
    }

    .media { margin-top: 1.5rem; }
    .media h2 { margin-bottom: 0.75rem; }

    .media-grid {
      display: flex;
      flex-wrap: wrap;
      gap: var(--media-gap);
      align-items: flex-start;
    }

    .media-tile {
      height: var(--media-row-height);
      flex: 0 0 auto;
      position: relative;
      overflow: hidden;

      border-radius: var(--media-radius); /* <- neu */
      cursor: pointer;                    /* <- kein zoom cursor, aber klickbar */
    }

    .media-tile img {
      height: 100%;
      width: 100%;
      display: block;
      object-fit: cover; /* keine schwarzen Balken */
      cursor: pointer;
    }

    .yt-thumb { cursor: pointer; }

    .yt-play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .yt-play::before {
      content: "";
      width: 54px;
      height: 38px;
      background: rgba(0,0,0,0.55);
      border-radius: 10px;
    }
    .yt-play::after {
      content: "";
      position: absolute;
      width: 0;
      height: 0;
      border-left: 14px solid white;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      transform: translateX(2px);
    }

    .media-tile iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    @media (min-width: 900px) {
      .detail-header { grid-template-columns: 420px 1fr; }
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
    }
    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: min(1100px, 96vw);
      max-height: 86vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox img {
      max-width: 100%;
      max-height: 86vh;
      border-radius: 12px;
      display: block;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      background: #111;
    }

    .lb-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      color: white;
      border: 0;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 22px;
      display: grid;
      place-items: center;
      user-select: none;
    }
    .lb-btn:hover { background: rgba(255,255,255,0.20); }

    .lb-prev { left: -56px; }
    .lb-next { right: -56px; }

    .lb-close {
      position: absolute;
      top: -56px;
      right: 0;
      background: rgba(255,255,255,0.12);
      color: white;
      border: 0;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 20px;
      display: grid;
      place-items: center;
    }
    .lb-close:hover { background: rgba(255,255,255,0.20); }

    @media (max-width: 700px) {
      .lb-prev { left: 8px; }
      .lb-next { right: 8px; }
      .lb-close { top: 8px; right: 8px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>We can make our plans, but the LORD determines our steps. Proverbs 16:9</h1>
  </header>

  <main id="main-content">
    <div class="grid" id="project-list"></div>

    <div class="detail-view" id="project-detail">
      <button class="back-btn" onclick="goBack()">← Back</button>

      <div class="detail-header">
        <div class="detail-banner-wrap">
          <img id="detail-img" class="detail-image" src="" alt="Project Banner">
        </div>

        <div class="detail-content">
          <h2 id="detail-title"></h2>
          <div id="detail-year" class="detail-year"></div>
          <div id="detail-desc" class="detail-desc"></div>
          <div id="detail-links"></div>
        </div>
      </div>

      <div class="media">
        <h2>MEDIA</h2>
        <div class="media-grid" id="detail-media"></div>
      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner" id="lightboxInner">
      <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
      <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">‹</button>
      <img id="lbImage" alt="Preview" />
      <button class="lb-btn lb-next" id="lbNext" aria-label="Next">›</button>
    </div>
  </div>

  <script src="projects.js"></script>
  <script>
    const projectList = document.getElementById('project-list');
    const detailView = document.getElementById('project-detail');

    // Lightbox state
    const lightbox = document.getElementById('lightbox');
    const lbImage = document.getElementById('lbImage');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');
    const lbClose = document.getElementById('lbClose');

    let currentMedia = [];   // image URLs for lightbox
    let currentIndex = 0;

    // Build menu
    projects.forEach((p, index) => {
      const div = document.createElement('div');
      div.className = 'banner';
      div.style.backgroundImage = `url(${p.banner})`;
      div.onclick = () => openProject(index);

      const titleOverlay = document.createElement('div');
      titleOverlay.className = 'banner-title';
      titleOverlay.textContent = p.title;

      div.appendChild(titleOverlay);
      projectList.appendChild(div);
    });

    function isYouTube(url) {
      return url.includes("youtube.com") || url.includes("youtu.be");
    }

    function getYouTubeId(url) {
      try {
        if (url.includes("youtu.be")) return url.split("/").pop().split("?")[0];
        const u = new URL(url);
        return u.searchParams.get("v");
      } catch {
        return null;
      }
    }

    function openProject(index) {
      const p = projects[index];

      document.getElementById('project-list').style.display = 'none';
      detailView.style.display = 'flex';

      document.getElementById('detail-img').src = p.banner;
      document.getElementById('detail-title').textContent = p.title;
      document.getElementById('detail-year').textContent = p.year || "";
      document.getElementById('detail-desc').textContent = p.description || "";

      // Links
      const linksContainer = document.getElementById('detail-links');
      linksContainer.innerHTML = '';
      (p.links || []).forEach(link => {
        if (!link.url) return;
        const a = document.createElement('a');
        a.href = link.url;
        a.textContent = link.label;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        linksContainer.appendChild(a);
      });

      // MEDIA
      const mediaContainer = document.getElementById('detail-media');
      mediaContainer.innerHTML = '';

      const items = (p.media || []).filter(Boolean);

      // IMPORTANT: lightbox list (only images, no youtube)
      currentMedia = items.filter(u => !isYouTube(u));
      currentIndex = 0;

      // For justified layout
      const mediaItems = []; // { tile, aspect }

      function createYouTubeTile(url) {
        const id = getYouTubeId(url);
        if (!id) return;

        const tile = document.createElement('div');
        tile.className = 'media-tile';

        const img = document.createElement('img');
        img.className = 'yt-thumb';
        img.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
        img.alt = 'YouTube Video';

        const play = document.createElement('div');
        play.className = 'yt-play';

        // Click -> replace with iframe (inline)
        tile.addEventListener('click', () => {
          tile.innerHTML = '';
          const iframe = document.createElement('iframe');
          iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          iframe.allowFullscreen = true;
          tile.appendChild(iframe);
        }, { once: true });

        tile.appendChild(img);
        tile.appendChild(play);

        mediaItems.push({ tile, aspect: 16/9 });
        mediaContainer.appendChild(tile);
      }

      function createImageTile(url) {
        const tile = document.createElement('div');
        tile.className = 'media-tile';

        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Media';
        img.loading = 'lazy';

        tile.appendChild(img);
        mediaContainer.appendChild(tile);

        // CLICK ON TILE -> Lightbox
        tile.addEventListener('click', () => {
          const idx = currentMedia.indexOf(url);
          if (idx >= 0) openLightbox(idx);
        });

        img.addEventListener('load', () => {
          const aspect = (img.naturalWidth && img.naturalHeight)
            ? (img.naturalWidth / img.naturalHeight)
            : (4/3);
          mediaItems.push({ tile, aspect });
          layoutJustifiedRows();
        });

        img.addEventListener('error', () => {
          mediaItems.push({ tile, aspect: 4/3 });
          layoutJustifiedRows();
        });
      }

      items.forEach(url => {
        if (isYouTube(url)) createYouTubeTile(url);
        else createImageTile(url);
      });

      function layoutJustifiedRows() {
        const gap = parseFloat(getComputedStyle(mediaContainer).gap) || 14;
        const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--media-row-height')) || 180;
        const W = mediaContainer.clientWidth;

        const list = mediaItems.slice();

        let row = [];
        let rowAspectSum = 0;

        function flushRow(isLast) {
          if (!row.length) return;
          const gapsTotal = gap * (row.length - 1);
          const targetW = W - gapsTotal;

          let rowH = targetW / rowAspectSum;
          if (isLast) rowH = Math.min(rowH, H);

          row.forEach(({ tile, aspect }) => {
            tile.style.height = `${rowH}px`;
            tile.style.width = `${rowH * aspect}px`;
          });

          row = [];
          rowAspectSum = 0;
        }

        for (const item of list) {
          row.push(item);
          rowAspectSum += item.aspect;

          const gapsTotal = gap * (row.length - 1);
          const approxW = H * rowAspectSum + gapsTotal;

          if (approxW >= W) flushRow(false);
        }
        flushRow(true);
      }

      layoutJustifiedRows();

      window.onresize = () => layoutJustifiedRows();
    }

    function goBack() {
      detailView.style.display = 'none';
      document.getElementById('project-list').style.display = 'grid';
      closeLightbox();
    }

    function openLightbox(index) {
      currentIndex = index;
      lbImage.src = currentMedia[currentIndex];
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      updateLbButtons();
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lbImage.src = "";
      document.body.style.overflow = '';
    }

    function updateLbButtons() {
      const show = currentMedia.length > 1;
      lbPrev.style.display = show ? 'grid' : 'none';
      lbNext.style.display = show ? 'grid' : 'none';
    }

    function prevImage() {
      if (!currentMedia.length) return;
      currentIndex = (currentIndex - 1 + currentMedia.length) % currentMedia.length;
      lbImage.src = currentMedia[currentIndex];
    }

    function nextImage() {
      if (!currentMedia.length) return;
      currentIndex = (currentIndex + 1) % currentMedia.length;
      lbImage.src = currentMedia[currentIndex];
    }

    lbPrev.addEventListener('click', prevImage);
    lbNext.addEventListener('click', nextImage);
    lbClose.addEventListener('click', closeLightbox);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    window.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') prevImage();
      if (e.key === 'ArrowRight') nextImage();
    });
  </script>
</body>
</html>
